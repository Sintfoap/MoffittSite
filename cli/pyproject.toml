[project]
name = "sintfoap"
version = "0.1.0"
description = "Sign in to sintfoap.xyz from the terminal and see your dashboard"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.scripts]
sintfoap = "sintfoap.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sintfoap"]
