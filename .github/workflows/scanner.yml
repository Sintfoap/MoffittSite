name: Pantry scanner app

# The Pantry scanner in scanner/: its tests and a test build for every change
# to it, and a signed release when a tag scanner-v<N> is pushed (N is the
# version, a whole number that goes up each time). The release is what the
# Pantry page's "Phone scanner" offers, and what the app's update check finds
# (/pantry/scanner/latest.json, src/pantry.js). Signing uses the same
# repository secrets as the phone app (.github/workflows/android.yml):
# ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.

on:
  push:
    tags: ["scanner-v*"]
  pull_request:
    paths: ["scanner/**", ".github/workflows/scanner.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Tests
        run: gradle -p scanner testDebugUnitTest

      - name: Test build
        if: ${{ !startsWith(github.ref, 'refs/tags/scanner-v') }}
        run: gradle -p scanner assembleDebug

      - name: Release build
        if: ${{ startsWith(github.ref, 'refs/tags/scanner-v') }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version="${GITHUB_REF_NAME#scanner-v}"
          [[ "$version" =~ ^[0-9]{1,6}$ ]] || { echo "::error::tags look like scanner-v3, got $GITHUB_REF_NAME"; exit 1; }
          [ -n "$KEYSTORE_B64" ] || { echo "::error::the ANDROID_KEYSTORE_B64 secret isn't set (see the README's Phone app section)"; exit 1; }
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE"
          gradle -p scanner assembleRelease -PappVersion="$version"
          cp scanner/app/build/outputs/apk/release/app-release.apk pantry-scanner.apk

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/scanner-v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: "Pantry scanner ${{ github.ref_name }}"
          files: pantry-scanner.apk
          generate_release_notes: true
