name: Pantry scanner app (iPhone)

# The iPhone Pantry scanner in scanner-ios/: its tests and a build for the
# simulator on every change to it, and a signed build uploaded to TestFlight
# when a tag scanner-ios-v<N> is pushed (N is the build number, a whole number
# that goes up each time). iOS apps can only be built on a Mac, so this runs on
# GitHub's macOS runners.
#
# Releasing needs an Apple Developer account and these repository secrets
# (README, "Pantry scanner (iPhone)"):
#   APPLE_TEAM_ID       the team's 10-character ID (developer.apple.com → Membership)
#   ASC_KEY_ID          an App Store Connect API key's ID (Users and Access → Integrations, role Admin)
#   ASC_ISSUER_ID       the issuer ID shown above that list
#   ASC_KEY_P8          the key's .p8 file, as it downloads (the whole text)
# Xcode signs with them itself ("cloud signing"): no certificates or profiles to export.

on:
  push:
    tags: ["scanner-ios-v*"]
  pull_request:
    paths: ["scanner-ios/**", ".github/workflows/scanner-ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Tests
        run: swift test --package-path scanner-ios/Core

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd scanner-ios && xcodegen

      - name: Test build (simulator)
        if: ${{ !startsWith(github.ref, 'refs/tags/scanner-ios-v') }}
        run: |
          xcodebuild build -project scanner-ios/PantryScanner.xcodeproj -scheme PantryScanner \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error|warning: .*Swift|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -B2 -A6 "error:" build.log | head -80; exit 1; }

      - name: Release build, to TestFlight
        if: ${{ startsWith(github.ref, 'refs/tags/scanner-ios-v') }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          build="${GITHUB_REF_NAME#scanner-ios-v}"
          [[ "$build" =~ ^[0-9]{1,6}$ ]] || { echo "::error::tags look like scanner-ios-v3, got $GITHUB_REF_NAME"; exit 1; }
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!s}" ] || { echo "::error::the $s secret isn't set (see the README's Pantry scanner (iPhone) section)"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project scanner-ios/PantryScanner.xcodeproj -scheme PantryScanner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PantryScanner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$build" MARKETING_VERSION="1.$build" "${auth[@]}"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PantryScanner.xcarchive" \
            -exportOptionsPlist scanner-ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          echo "Build $build is uploaded. It shows in TestFlight once Apple has processed it (usually 5 to 30 minutes)." >> "$GITHUB_STEP_SUMMARY"
