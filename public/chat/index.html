<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat · sintfoap.xyz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The Console look (src/pages.js): monospace, square double-ruled panels,
   gold on green-black, the shared rail and the key bar. */
:root { color-scheme: light;
  --bg:#f2f0e6; --rail:#ebe8dc; --panel:#fbfaf4; --field:#ffffff; --line:#cfc9b0; --line-2:#a9a283;
  --gold:#8a6510; --gold-soft:#e9e1c2; --on-gold:#fbf7ea; --ink:#1c1d16; --muted:#4d4c3f; --faint:#7a7764;
  --bad:#b4412f; --good:#2f7a52; --warn:#946c0c; --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --surface:var(--rail); --accent:var(--gold); --accent-soft:var(--gold-soft); --sans:var(--mono); }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark;
  --bg:#0b0f0a; --rail:#0e140e; --panel:#121a12; --field:#0e140e; --line:#4a4430; --line-2:#6a6243;
  --gold:#d6ae5e; --gold-soft:#24251a; --on-gold:#1a1206; --ink:#f4efe6; --muted:#c6bcab; --faint:#8a8270;
  --bad:#e47a62; --good:#7fcf98; --warn:#e0b25a; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.6 var(--mono); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
::selection { background: var(--gold); color: var(--on-gold); }
[hidden] { display: none !important; }

/* the site rail (the dashboard sends it, with its own styles) beside the page, the key bar under both */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; height: 100dvh; padding-bottom: 38px; }
kbd { font: 700 11px var(--mono); color: var(--gold); }
.keybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 38px; display: flex; align-items: center; gap: 22px; overflow-x: auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); white-space: nowrap;
  background: var(--rail); border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; scrollbar-width: none; }
.keybar a { color: var(--muted); text-decoration: none; }
.keybar a:hover { color: var(--ink); }
.keybar kbd { font-size: 13px; margin-right: 6px; }
.keybar .end { margin-left: auto; }

/* the page */
main { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 34px clamp(16px, 4vw, 48px) 18px; }
.kicker { font: 700 13px var(--mono); letter-spacing: .55em; color: var(--gold); text-transform: uppercase; }
h1 { font: 700 clamp(22px, 4vw, 30px)/1.25 var(--mono); margin: 10px 0 18px; }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; max-width: 1080px; }

.panel { position: relative; background: var(--panel); border: 1px solid var(--line); min-height: 0; }
.panel::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line); pointer-events: none; }

button.btn { display: inline-block; padding: 8px 16px; font: 700 12.5px var(--mono); letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--on-gold); background: var(--gold); border: 1px solid var(--gold); border-radius: 0; cursor: pointer; }
button.btn.quiet { background: transparent; color: var(--gold); border-color: var(--line-2); }
button.btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in oklch, var(--bad) 50%, transparent); }
button.btn:disabled { opacity: .45; cursor: default; }
button.link { border: 0; background: none; padding: 2px 4px; color: var(--muted); cursor: pointer; font-size: 12.5px; }
button.link:hover { color: var(--gold); }

/* room list */
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.side .panel { flex: 1; overflow-y: auto; padding: 14px 12px; }
.side h2 { margin: 0 6px 6px; font: 400 11px var(--mono); letter-spacing: 3px; text-transform: uppercase; color: var(--faint); }
.side section + section { margin-top: 16px; }
.rooms { display: flex; flex-direction: column; gap: 1px; }
.rooms button { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-left: 2px solid transparent;
  background: none; padding: 5px 8px; color: var(--muted); cursor: pointer; }
.rooms button:hover { background: var(--gold-soft); color: var(--ink); }
.rooms button[aria-current="true"] { background: var(--gold-soft); border-left-color: var(--gold); color: var(--ink); font-weight: 700; }
.rooms .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rooms .name::before { content: "# "; color: var(--faint); font-weight: 400; }
.rooms .n { font-size: 11.5px; font-weight: 700; padding: 0 6px; background: var(--gold); color: var(--on-gold); }
.rooms .count { font-size: 12px; color: var(--faint); }
.side .none { margin: 0 8px; font-size: 12.5px; color: var(--faint); }

/* the open room */
.room { display: flex; flex-direction: column; overflow: hidden; }
.room-head { display: flex; align-items: center; gap: 6px; padding: 14px 18px 12px; border-bottom: 1px dashed var(--line); }
.room-head .title { flex: 1; min-width: 0; }
.room-head h2 { margin: 0; font: 700 15px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-head h2::before { content: "# "; color: var(--gold); }
.room-head p { margin: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-head .back { display: none; }
.log { flex: 1; overflow-y: auto; padding: 8px 18px 12px; display: flex; flex-direction: column; scrollbar-color: var(--line) transparent; }
.log .older { align-self: center; margin: 6px 0; }
.log .day { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--faint); }
.log .day::before, .log .day::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
.msg { position: relative; padding: 1px 70px 1px 0; }
.msg.first { margin-top: 10px; }
.msg .who { font-weight: 700; color: var(--ink); }
.msg .who .at { margin-left: 10px; font-weight: 400; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.msg.mine .who { color: var(--gold); }
.msg .del { position: absolute; right: 0; top: 0; visibility: hidden; }
.msg:hover .del, .msg:focus-within .del { visibility: visible; }
.msg.pending { opacity: .5; }
.log .empty, .welcome { margin: auto; text-align: center; color: var(--muted); padding: 24px; max-width: 420px; }
.log .empty b, .welcome b { display: block; color: var(--ink); margin-bottom: 4px; }

.composer { display: flex; gap: 8px; align-items: flex-end; padding: 12px 18px 16px; border-top: 1px dashed var(--line); }
.composer .prompt { align-self: center; color: var(--gold); font-weight: 700; }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 160px; padding: 8px 11px; line-height: 1.5;
  background: var(--field); border: 1px solid var(--line-2); border-radius: 0; color: var(--ink); }
.composer textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.joinbar { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 14px 18px 16px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 13px; }

/* dialogs */
dialog { border: 1px solid var(--line-2); border-radius: 0; background: var(--panel); color: var(--ink); padding: 0; width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .55); }
dialog form { padding: 22px 24px; display: flex; flex-direction: column; gap: 4px; }
dialog h2 { margin: 0 0 6px; font: 700 15px/1.4 var(--mono); }
dialog label { display: block; font: 400 12px var(--mono); letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin: 12px 0 6px; }
dialog input { width: 100%; padding: 9px 11px; font: 15px var(--mono); color: var(--ink); background: var(--field); border: 1px solid var(--line-2); border-radius: 0; }
dialog input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
dialog ul { margin: 0; padding: 0; list-style: none; max-height: 50vh; overflow-y: auto; }
dialog li { padding: 7px 0; border-top: 1px dashed var(--line); }
dialog li span { color: var(--faint); font-size: 12.5px; margin-left: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.actions .spacer { flex: 1; }
.error { color: var(--bad); font-size: 13px; margin: 8px 0 0; }

.toast { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); padding: 8px 14px; background: var(--panel); border: 1px solid var(--line-2);
  border-left: 3px solid var(--gold); color: var(--ink); font-size: 13px; }

/* phones: the rail goes across the top, and the list and the open room take turns */
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); padding-bottom: 0; }
  .keybar { display: none; }
  main { padding: 18px 12px 12px; }
  .kicker, h1 { display: none; }
  .layout { grid-template-columns: 1fr; }
  body.in-room .side { display: none; }
  body:not(.in-room) .room { display: none; }
  .room-head .back { display: inline-block; }
  .msg { padding-right: 0; }
  .msg .del { visibility: visible; position: static; }
  .toast { bottom: 18px; }
}
</style>
</head>
<body>
<div class="shell">
<!--site-rail-->
<main>
  <div class="kicker">Chat</div>
  <h1>Rooms</h1>
  <div class="layout">
    <aside class="side">
      <button class="btn" id="new">+ New room</button>
      <div class="panel">
        <section><h2>Your rooms</h2><div class="rooms" id="joined"></div></section>
        <section><h2>Other rooms</h2><div class="rooms" id="others"></div></section>
      </div>
    </aside>
    <section class="panel room" id="room" aria-live="polite">
      <div class="welcome"><b>Pick a room</b>Choose one from the list, or make a new one. Anyone signed in here can find and join your rooms.</div>
    </section>
  </div>
</main>
</div>

<dialog id="room-dialog">
  <form method="dialog" id="room-form">
    <h2 id="room-dialog-title">New room</h2>
    <label for="room-name">Name</label><input id="room-name" name="name" maxlength="60" required autocomplete="off">
    <label for="room-topic">Topic</label><input id="room-topic" name="topic" maxlength="200" autocomplete="off" placeholder="optional">
    <p class="error" id="room-error" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="room-delete" hidden>Delete room</button>
      <span class="spacer"></span>
      <button type="button" class="btn quiet" id="room-cancel">Cancel</button>
      <button type="submit" class="btn" id="room-save">Create</button>
    </div>
  </form>
</dialog>

<dialog id="members-dialog">
  <form method="dialog">
    <h2>Members</h2>
    <ul id="members"></ul>
    <div class="actions"><span class="spacer"></span><button class="btn quiet">Close</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<footer class="keybar" aria-label="Keyboard shortcuts"><span><kbd>n</kbd>New room</span><span><kbd>/</kbd>Message</span><span><kbd>↵</kbd>Send</span><span><kbd>⇧↵</kbd>New line</span><span><kbd>esc</kbd>Rooms</span><span><kbd>g</kbd>then a key from the menu to jump</span><a class="end" href="/logout" data-key="o"><kbd>g o</kbd>Sign out</a></footer>
<script src="/keys.js" defer></script>
<script type="module" src="/chat/app.js"></script>
</body>
</html>
