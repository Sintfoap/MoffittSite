<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>sintfoap</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f0a">
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/m/app.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The phone app's own look: the site's colours (src/pages.js), with readable
   sans-serif text, big touch targets, a tab bar at the bottom and sheets
   that slide up instead of dialogs and side rails. */
:root { color-scheme: dark;
  --bg:#0b0f0a; --panel:#121a12; --raised:#172117; --field:#0e140e; --line:#2c3324; --line-2:#4a4430;
  --gold:#d6ae5e; --gold-soft:#24251a; --on-gold:#1a1206; --ink:#f4efe6; --muted:#c6bcab; --faint:#8a8270;
  --bad:#e47a62; --good:#7fcf98; --blue:#8fb3d9; --violet:#b79ad6; --amber:#e0b25a;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabs: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --r: 14px; }
@media (prefers-color-scheme: light) { :root { color-scheme: light;
  --bg:#f2f0e6; --panel:#fbfaf4; --raised:#ffffff; --field:#ffffff; --line:#ddd7c1; --line-2:#a9a283;
  --gold:#8a6510; --gold-soft:#ece5ca; --on-gold:#fbf7ea; --ink:#1c1d16; --muted:#4d4c3f; --faint:#7a7764;
  --bad:#b4412f; --good:#2f7a52; --blue:#3c6c9c; --violet:#7a52a6; --amber:#946c0c; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--gold); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .86em; }

/* the shell: the screen scrolls above the tab bar */
.app { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
#main { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 24px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
body.composing #main { padding-bottom: 0; }
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: var(--safe-b); }
.tab { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 9px 0 7px; color: var(--faint); text-decoration: none; font: 700 11px var(--mono); letter-spacing: .04em; position: relative; }
.tab[aria-current="page"] { color: var(--gold); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px; background: var(--gold); border-radius: 0 0 2px 2px; }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); }
body.focus .tabs { display: none; }

/* headers */
.bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; margin: 0 -16px; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.bar > div { flex: 1; min-width: 0; }
.bar h1 { margin: 0; font: 700 22px/1.2 var(--mono); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .acts { display: flex; gap: 4px; align-items: center; }
.hero { padding: calc(28px + env(safe-area-inset-top)) 2px 14px; }
.hero h1 { margin: 4px 0 0; font: 700 26px/1.2 var(--mono); }
.kicker { margin: 0; font: 700 12px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.label { display: flex; align-items: center; gap: 8px; margin: 22px 2px 8px; font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.label small { color: var(--faint); letter-spacing: 0; }
.label .link { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--gold); color: var(--on-gold); font: 700 14px var(--mono); text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.bad, .bad { color: var(--bad); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); cursor: pointer; }
.icon-btn:active { background: var(--gold-soft); }
.link { border: 0; background: none; color: var(--gold); font: 700 13px var(--mono); padding: 8px 4px; cursor: pointer; }
.badge { min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: var(--on-gold); font: 700 11px/19px var(--mono); text-align: center; }
.badge.soft { background: var(--gold-soft); color: var(--gold); }

/* cards and lists */
.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin: 12px 0; padding: 4px 0; color: inherit; text-decoration: none; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: inherit; text-decoration: none; flex-wrap: wrap; }
.card-head h2 { margin: 0; font: 700 15px var(--mono); flex: 1 0 auto; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.card-head svg { color: var(--faint); }
.card .more { display: block; padding: 10px 14px 12px; font: 700 13px var(--mono); text-decoration: none; }
.card.nudge { padding: 14px; display: grid; gap: 4px; }
.card.nudge span { color: var(--muted); font-size: 14px; }
.card.update { border-color: var(--gold); background: var(--gold-soft); }
.card.me { display: flex; gap: 14px; align-items: center; padding: 14px; }
.card.me div:last-child { display: grid; }
.card.me .mono { color: var(--muted); }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); font: 700 20px var(--mono); flex: none; }
.list { padding: 0; overflow: hidden; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 0 14px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); text-align: left; text-decoration: none; }
.li:first-child { border-top: 0; }
.li.act { cursor: pointer; }
.li.act:active { background: var(--gold-soft); }
.li span { color: var(--muted); }
.li svg { color: var(--faint); flex: none; }
.fine { color: var(--faint); font-size: 12.5px; margin: 14px 2px; }
.hint { color: var(--muted); font-size: 14px; margin: 8px 2px 14px; }
.hint.center { text-align: center; margin-top: 30vh; }
.empty { text-align: center; padding: 15vh 18px 30px; }
.empty h2 { font: 700 17px var(--mono); margin: 0 0 6px; }
.empty p { color: var(--muted); margin: 0 0 18px; }
.loading { height: 40vh; display: grid; place-items: center; }
.loading::after { content: ""; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }

/* chips: Drift's views across the top, quick dates in the item sheet */
.pills { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; scroll-padding: 16px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: 700 13px var(--mono); text-decoration: none; white-space: nowrap; cursor: pointer; }
.pill small { color: var(--gold); }
.pill.on { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.pill.on small { color: var(--on-gold); opacity: .75; }
.pill.ghost { border-style: dashed; }
.seg { display: flex; padding: 3px; margin: 0 0 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.seg > button, .seg > label { flex: 1; min-height: 36px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: 700 13px var(--mono); display: grid; place-items: center; cursor: pointer; }
.seg > button[aria-selected="true"], .seg > label:has(input:checked) { background: var(--raised); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.search { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
.search input { flex: 1; }

/* Drift's items */
.items { list-style: none; margin: 0; padding: 0; }
.group .items, .card .items { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card .items { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; }
.item { display: flex; align-items: flex-start; gap: 2px; border-top: 1px solid var(--line); padding-left: calc(var(--depth, 0) * 22px); position: relative; }
.item:first-child { border-top: 0; }
.item.p1::before, .item.p2::before, .item.p3::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; }
.item.p1::before { background: var(--blue); } .item.p2::before { background: var(--amber); } .item.p3::before { background: var(--bad); }
.check { flex: none; width: 50px; height: 52px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: transparent; }
.check svg { width: 24px; height: 24px; padding: 3px; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--line-2); stroke-width: 3; }
.done .check { color: var(--on-gold); }
.done .check svg { background: var(--good); box-shadow: none; }
.dot { flex: none; width: 50px; height: 52px; display: grid; place-items: center; }
.dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.item .body { flex: 1; min-width: 0; display: grid; gap: 4px; padding: 14px 14px 13px 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.item .t { overflow-wrap: anywhere; }
.done .t { color: var(--faint); text-decoration: line-through; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 12px var(--mono); color: var(--muted); }
.chip.gold { color: var(--gold); } .chip.bad { color: var(--bad); }
.chip.tag { color: var(--blue); } .chip.col { color: var(--violet); }
.chip.p1 { color: var(--blue); } .chip.p2 { color: var(--amber); } .chip.p3 { color: var(--bad); }
.done .chip { color: var(--faint); }
.links { font: 500 12px var(--mono); color: var(--faint); }

/* the week strip */
.week { margin: 2px 0 4px; }
.week-head { display: flex; align-items: center; justify-content: space-between; }
.week-head h2 { margin: 0 2px; font: 700 15px var(--mono); }
.week-head span { display: flex; align-items: center; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
.day { display: grid; justify-items: center; gap: 1px; padding: 8px 0 6px; border: 0; border-radius: 12px; background: none; color: var(--ink); cursor: pointer; }
.day .wd { font: 700 11px var(--mono); color: var(--faint); }
.day b { font: 700 17px var(--mono); }
.day i { font-style: normal; height: 12px; line-height: 10px; color: var(--gold); letter-spacing: 1px; }
.day.now b { color: var(--gold); }
.day.sel { background: var(--gold); color: var(--on-gold); }
.day.sel .wd, .day.sel i, .day.sel.now b { color: var(--on-gold); }

/* the composer: quick-add in Drift, the message box in Chat */
.composer { position: sticky; bottom: 0; z-index: 3; margin: 14px -16px 0; padding: 8px 16px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.composer .row { display: flex; gap: 8px; align-items: flex-end; }
.composer input, .composer textarea { flex: 1; min-height: 46px; padding: 11px 16px; border-radius: 23px; border: 1px solid var(--line-2); background: var(--field); resize: none; max-height: 140px; }
.composer .send { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; cursor: pointer; }
.composer .send:disabled, .composer input:disabled { opacity: .45; }
.preview { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 6px; }
.preview:not(:empty) { padding-bottom: 8px; }
.replying { display: flex; align-items: center; justify-content: space-between; padding: 0 0 6px 8px; font-size: 13px; color: var(--muted); }

/* forms and sheets */
input:not([type=checkbox]):not([type=radio]), textarea, select { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--field); }
textarea { resize: vertical; }
.form { display: grid; gap: 12px; }
.form h2 { margin: 0; font: 700 18px var(--mono); }
.form p { margin: 0; color: var(--muted); }
.form label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.form .row { display: flex; gap: 8px; }
.form .row input { flex: 1; }
.card.form { padding: 14px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex !important; align-items: center; gap: 10px !important; min-height: 44px; color: var(--ink) !important; font-size: 15px !important; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); flex: none; }
.toggle.wide span { display: grid; }
.toggle.wide small { color: var(--muted); font-size: 13px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick .pill { height: 32px; }
.moves { display: flex; align-items: center; gap: 2px; }
.moves .fine { margin: 0 auto 0 0; }
.buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.buttons .btn { flex: 1; }
.err { color: var(--bad) !important; font-size: 14px; }
.err:empty { display: none; }
.sheet { width: 100%; max-width: 640px; max-height: 88dvh; margin: auto auto 0; padding: 8px 18px calc(18px + var(--safe-b)); border: 0; border-radius: 22px 22px 0 0; background: var(--raised); color: var(--ink); overflow-y: auto; animation: up .22s ease-out; }
.sheet::backdrop { background: rgb(0 0 0 / .5); }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 14px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.people { list-style: none; margin: 0 -18px; padding: 0; max-height: 34dvh; overflow-y: auto; }
.people .li { padding: 0 18px; }
.people .li span { color: var(--ink); display: flex; gap: 8px; align-items: center; }

/* Chat */
.rooms { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.card .rooms { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; }
.rooms li + li { border-top: 1px solid var(--line); }
.room { display: flex; align-items: center; gap: 12px; padding: 11px 14px; color: inherit; text-decoration: none; min-height: 60px; }
.room:active { background: var(--gold-soft); }
.mark { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); font: 700 15px var(--mono); position: relative; }
.mark.on::after { content: ""; position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--good); border: 2px solid var(--panel); }
.room .body { flex: 1; min-width: 0; display: grid; }
.room b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room small { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room.hot b { font-weight: 800; }
.room .end { display: grid; justify-items: end; gap: 4px; }
.room .end small { color: var(--faint); font: 500 11px var(--mono); }

body[data-screen="chat"].focus #main { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.room-bar { position: static; padding-left: 6px; }
.room-bar h1 { font-size: 18px; }
.log { flex: 1; overflow-y: auto; overscroll-behavior: contain; margin: 0 -16px; padding: 6px 12px 8px; }
.log .day { display: flex; justify-content: center; margin: 14px 0 6px; padding: 0; background: none; }
.log .day span { font: 700 11px var(--mono); color: var(--faint); background: var(--panel); padding: 3px 10px; border-radius: 10px; }
.msg { display: grid; justify-items: start; margin-top: 3px; }
.msg.first { margin-top: 10px; }
.msg.mine { justify-items: end; }
.who { font: 700 12px var(--mono); color: var(--gold); margin: 0 0 3px 12px; }
.bubble { max-width: 82%; padding: 8px 12px 6px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; cursor: pointer; }
.msg.mine .bubble { background: var(--gold-soft); border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); }
.msg.ping .bubble { box-shadow: inset 3px 0 0 var(--gold); }
.msg.pending { opacity: .55; }
.text { white-space: pre-wrap; }
.text pre { white-space: pre-wrap; background: var(--field); padding: 8px; border-radius: 8px; margin: 4px 0; font: 13px var(--mono); }
.text code { font: 13px var(--mono); }
.text blockquote { margin: 2px 0; padding-left: 10px; border-left: 3px solid var(--line-2); color: var(--muted); }
.text img, .pic { display: block; max-width: 100%; max-height: 300px; border-radius: 12px; }
.mention { color: var(--gold); font-weight: 700; }
.mention.you { background: var(--gold); color: var(--on-gold); border-radius: 4px; padding: 0 3px; }
.locked { color: var(--faint); display: inline-flex; gap: 6px; align-items: center; }
.quote { font-size: 13px; color: var(--muted); border-left: 3px solid var(--gold); padding: 2px 0 2px 8px; margin: 2px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
.at { display: block; text-align: right; font: 500 10.5px var(--mono); color: var(--faint); margin-top: 2px; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 6px 0; }
.react { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 2px 8px; font-size: 14px; }
.react[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.react b { font: 700 11px var(--mono); color: var(--muted); }
.older { display: block; margin: 6px auto; }
.typing { min-height: 20px; margin: 6px 12px 0; font-size: 13px; color: var(--muted); font-style: italic; }
.joinbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 -16px; padding: 12px 16px calc(12px + var(--safe-b)); background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.joinbar span { display: flex; gap: 8px; }
.composer.chat { margin-top: 0; padding-bottom: calc(10px + var(--safe-b)); }
.quick-reacts { display: flex; justify-content: space-between; gap: 4px; }
.quick-reacts button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--panel); font-size: 22px; cursor: pointer; }
.quick-reacts button[aria-pressed="true"] { background: var(--gold-soft); box-shadow: inset 0 0 0 2px var(--gold); }

#toast { position: fixed; z-index: 20; left: 16px; right: 16px; bottom: calc(var(--tabs) + 86px + var(--safe-b)); display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 520px; margin: 0 auto; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: 0 8px 24px rgb(0 0 0 / .35); }
#toast button { border: 0; background: none; color: var(--gold); font: 700 14px var(--mono); filter: brightness(.8); }
body.focus #toast { bottom: calc(90px + var(--safe-b)); }
</style>
</head>
<body>
<div class="app">
  <main id="main"><div class="loading" aria-busy="true"></div></main>
  <nav class="tabs" id="tabs" aria-label="App"></nav>
</div>
<div id="toast" role="status" hidden></div>
<script type="module" src="/m/app.js"></script>
</body>
</html>
