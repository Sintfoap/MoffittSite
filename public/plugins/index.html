<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plugin Store</title>
<meta name="theme-color" content="#0b0f0a">
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f0e6; --surface: #ebe8dc; --raise: #fbfaf4; --line: #cfc9b0; --line-2: #a9a283;
  --ink: #1c1d16; --muted: #4d4c3f; --faint: #7a7764;
  --accent: #8a6510; --accent-ink: #fbf7ea; --accent-soft: #e9e1c2;
  --red: #b4412f; --amber: #946c0c; --blue: #3f6aa8; --green: #2f7a52; --violet: #7656a8;
  --add: #dfeedb; --del: #f3ddd6;
  --shadow: 0 1px 0 rgba(35,36,58,.04), 0 8px 24px -12px rgba(35,36,58,.18);
  --radius-s: 0; --radius-m: 0; --radius-l: 0;
  --serif: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f0a; --surface: #0e140e; --raise: #121a12; --line: #4a4430; --line-2: #6a6243;
    --ink: #f4efe6; --muted: #c6bcab; --faint: #8a8270;
    --accent: #d6ae5e; --accent-ink: #1a1206; --accent-soft: #24251a;
    --red: #e47a62; --amber: #e0b25a; --blue: #7fa6d9; --green: #7fcf98; --violet: #c3a6f7;
    --add: #1d3320; --del: #3a2420;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 32px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f0a; --surface: #0e140e; --raise: #121a12; --line: #4a4430; --line-2: #6a6243;
    --ink: #f4efe6; --muted: #c6bcab; --faint: #8a8270;
    --accent: #d6ae5e; --accent-ink: #1a1206; --accent-soft: #24251a;
    --red: #e47a62; --amber: #e0b25a; --blue: #7fa6d9; --green: #7fcf98; --violet: #c3a6f7;
  --add: #1d3320; --del: #3a2420;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 12px 32px -14px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
a { color: var(--accent); }

/* the frame: the site rail (put in by the server at the marker below) beside the page */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; padding-bottom: 38px; }
main { padding: 40px clamp(16px, 4vw, 56px) 120px; max-width: 1180px; min-width: 0; }
.kicker { font: 700 13px var(--sans); letter-spacing: .55em; text-transform: uppercase; color: var(--accent); }

/* the key bar, the same on every signed-in page */
.keybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 38px; display: flex; align-items: center; gap: 22px; overflow-x: auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); white-space: nowrap; scrollbar-width: none;
  background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.keybar kbd { font: 700 13px var(--sans); color: var(--accent); margin-right: 6px; border: 0; background: none; padding: 0; }
.keybar a { color: var(--muted); text-decoration: none; }
.keybar .end { margin-left: auto; }
@media (max-width: 820px) { .keybar { display: none; } }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; padding-bottom: 0; }
  main { padding-top: 28px; }
}
h1 { margin: 10px 0 8px; font: 700 clamp(22px, 4vw, 30px)/1.25 var(--serif); }
.sub { margin: 0 0 22px; color: var(--muted); max-width: 640px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tabs .n { margin-left: 6px; font-size: 12px; padding: 1px 7px; border-radius: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.btn { border: 1px solid var(--line-2); background: var(--raise); border-radius: 8px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }
.ghost { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: var(--radius-s); }
.ghost:hover { background: var(--surface); color: var(--ink); }

.search { display: flex; gap: 10px; margin-bottom: 16px; }
.search input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--raise); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card {
  text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 130px;
  background: var(--raise); border: 1px solid var(--line); border-radius: var(--radius-m); box-shadow: var(--shadow);
}
.card:hover { border-color: var(--line-2); }
.card b { font-weight: 600; }
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.meta { font-size: 12.5px; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--radius-m); }
.empty b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; }

.badge { font-size: 12px; padding: 1px 8px; border-radius: 0; border: 1px solid currentColor; white-space: nowrap; }
.badge.draft { color: var(--muted); }
.badge.pending { color: var(--amber); }
.badge.approved { color: var(--green); }
.badge.rejected { color: var(--red); }

/* ── workshop ───────────────────────────────────── */
.workshop { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.mine { display: flex; flex-direction: column; gap: 4px; }
.mine button.item {
  display: flex; flex-direction: column; gap: 2px; text-align: left; border: 0; background: none;
  width: 100%; padding: 8px 10px; border-radius: var(--radius-s); color: var(--muted);
}
.mine button.item:hover { background: var(--surface); color: var(--ink); }
.mine button.item[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
.mine button.item span { font-weight: 500; }
.mine .new { margin-bottom: 8px; }
.editor { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fields { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label input, label textarea {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--raise); color: var(--ink); font-size: 14.5px;
}
.notice { padding: 10px 12px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.notice.bad { border-color: var(--red); }
.notice.good { border-color: var(--green); }
.notice b { font-weight: 600; }

.code {
  display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--radius-m);
  background: var(--raise); overflow: hidden; font: 13px/1.6 var(--mono); font-variant-ligatures: none;
}
.code:focus-within { border-color: var(--accent); }
.code .nums { padding: 12px 8px 12px 12px; text-align: right; color: var(--faint); user-select: none; white-space: pre; background: var(--surface); border-right: 1px solid var(--line); overflow: hidden; }
.code textarea {
  border: 0; outline: 0; resize: vertical; min-height: 420px; padding: 12px 14px; background: none; color: var(--ink);
  font: inherit; white-space: pre; overflow: auto; tab-size: 2;
}
.code textarea[readonly] { min-height: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .spacer { flex: 1; }
.status { font-size: 13px; color: var(--faint); }

/* ── review ─────────────────────────────────────── */
.review { display: flex; flex-direction: column; gap: 18px; }
.sub-card { padding: 18px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--radius-m); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.sub-card h3 { margin: 0; font-size: 17px; font-weight: 600; }
.sub-card blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--line-2); color: var(--muted); white-space: pre-wrap; }
.diff { font-variant-ligatures: none; margin: 0; max-height: 480px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-s); font: 12.5px/1.55 var(--mono); background: var(--surface); }
.diff div { padding: 0 12px; white-space: pre; min-height: 1.55em; }
.diff .add { background: var(--add); }
.diff .del { background: var(--del); }
.diff .add::before { content: "+ "; color: var(--green); }
.diff .del::before { content: "- "; color: var(--red); }
.diff .same::before { content: "  "; }
.diff .gap { color: var(--faint); font-style: italic; }

/* ── try it ─────────────────────────────────────── */
.try { display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--radius-m); box-shadow: var(--shadow); }
.try h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.try h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.try-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.try .rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.try .rows li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); }
.try .rows .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); }
.try .preview { padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: var(--radius-s); background: var(--surface); }
.try .preview label { margin-bottom: 8px; }
.try .preview.canvas { padding: 0; border-style: solid; }
.plugin-canvas { display: block; width: 100%; height: 360px; touch-action: none; user-select: none; }
.plugin-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.try pre { margin: 6px 0 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; }
.try kbd { font: 12px var(--mono); padding: 0 5px; border: 1px solid var(--line-2); border-radius: 4px; }
.try summary { cursor: pointer; font-size: 13px; color: var(--muted); }
a.btn { text-decoration: none; color: var(--ink); }

dialog { border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--raise); color: var(--ink); padding: 0; width: min(760px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 20, 32, .45); }
dialog form, dialog .body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
dialog h2 { margin: 0; font: 700 17px/1.3 var(--serif); }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 9px 16px; border-radius: 0; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow); }

@media (max-width: 760px) {
  .workshop { grid-template-columns: 1fr; }
  .fields { grid-template-columns: 1fr; }
  .try-grid { grid-template-columns: 1fr; }
  .code textarea { min-height: 320px; }
}
</style>
</head>
<body>
<div class="shell">
<!--site-rail-->
<main>
  <div class="kicker">Drift</div>
  <h1>Plugin store</h1>
  <p class="sub">Plugins add new kinds of data and new views to Drift. Add one to your Drift from the store, or write your own, try it, and send it for review. Once it's approved anyone can use it.</p>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="store" aria-selected="true">Store</button>
    <button role="tab" data-tab="workshop" aria-selected="false">My plugins</button>
    <button role="tab" data-tab="review" aria-selected="false" hidden>Review<span class="n" id="waiting" hidden></span></button>
  </nav>

  <section id="tab-store">
    <div class="search"><input id="q" type="search" placeholder="Search plugins" aria-label="Search plugins"></div>
    <div id="store" class="grid"></div>
  </section>

  <section id="tab-workshop" hidden>
    <div class="workshop">
      <div class="mine">
        <button class="btn primary new" id="new">New plugin</button>
        <div id="mine"></div>
      </div>
      <div class="editor" id="editor"></div>
    </div>
  </section>

  <section id="tab-review" hidden>
    <div class="review" id="queue"></div>
  </section>
</main>
</div>

<dialog id="create">
  <form method="dialog" id="create-form">
    <h2>New plugin</h2>
    <label>Id<input name="id" required pattern="[a-z]{2,30}" placeholder="mood" autocomplete="off" spellcheck="false">
      <span class="status">2 to 30 lowercase letters. It's where the plugin keeps its data on each item, and can't change later.</span></label>
    <label>Name<input name="name" required maxlength="60" placeholder="Mood"></label>
    <label>Description<input name="description" maxlength="300" placeholder="Note how you felt about each item."></label>
    <div class="notice bad" id="create-error" hidden></div>
    <div class="actions"><span class="spacer"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Create</button></div>
  </form>
</dialog>

<dialog id="detail"><div class="body" id="detail-body"></div></dialog>

<div class="toast" id="toast" role="status" hidden></div>
<footer class="keybar" aria-label="Keyboard shortcuts"><span><kbd>g</kbd>then a key from the menu to jump</span><span><kbd>tab</kbd>Move</span><span><kbd>↵</kbd>Open</span><a class="end" href="/logout" data-key="o"><kbd>g o</kbd>Sign out</a></footer>
<script src="/keys.js" defer></script>
<script type="module" src="/plugins/store.js"></script>
</body>
</html>
