<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe box · sintfoap.xyz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f0a">
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The Console look (src/pages.js): monospace, square double-ruled panels,
   gold on green-black, the shared rail and the key bar. */
:root { color-scheme: light;
  --bg:#f2f0e6; --rail:#ebe8dc; --panel:#fbfaf4; --field:#ffffff; --line:#cfc9b0; --line-2:#a9a283;
  --gold:#8a6510; --gold-soft:#e9e1c2; --on-gold:#fbf7ea; --ink:#1c1d16; --muted:#4d4c3f; --faint:#7a7764;
  --bad:#b4412f; --good:#2f7a52; --warn:#946c0c; --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --surface:var(--rail); --accent:var(--gold); --accent-soft:var(--gold-soft); --sans:var(--mono); }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark;
  --bg:#0b0f0a; --rail:#0e140e; --panel:#121a12; --field:#0e140e; --line:#4a4430; --line-2:#6a6243;
  --gold:#d6ae5e; --gold-soft:#24251a; --on-gold:#1a1206; --ink:#f4efe6; --muted:#c6bcab; --faint:#8a8270;
  --bad:#e47a62; --good:#7fcf98; --warn:#e0b25a; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 14px/1.6 var(--mono); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
::selection { background: var(--gold); color: var(--on-gold); }
[hidden] { display: none !important; }

/* the site rail (the dashboard sends it, with its own styles) beside the page, the key bar under both */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; padding-bottom: 38px; }
kbd { font: 700 11px var(--mono); color: var(--gold); }
.keybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; height: 38px; display: flex; align-items: center; gap: 22px; overflow-x: auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); white-space: nowrap;
  background: var(--rail); border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; scrollbar-width: none; }
.keybar a { color: var(--muted); text-decoration: none; }
.keybar a:hover { color: var(--ink); }
.keybar kbd { font-size: 13px; margin-right: 6px; }
.keybar .end { margin-left: auto; }

/* the page */
main { min-width: 0; padding: 34px clamp(16px, 4vw, 48px) 56px; }
.kicker { font: 700 13px var(--mono); letter-spacing: .55em; color: var(--gold); text-transform: uppercase; }
h1 { font: 700 clamp(22px, 4vw, 30px)/1.25 var(--mono); margin: 10px 0 18px; }
h2 { font: 700 15px/1.4 var(--mono); margin: 0 0 10px; }
h3 { font: 400 11px var(--mono); letter-spacing: 3px; text-transform: uppercase; color: var(--faint); margin: 22px 0 8px; }
p { color: var(--muted); margin: 0 0 12px; }
.lede { margin: -6px 0 22px; max-width: 640px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 22px 24px; margin-bottom: 18px; }
.card::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line); pointer-events: none; }
.card > * { position: relative; }
.card > :last-child { margin-bottom: 0; }
.msg { padding: 10px 14px; margin-bottom: 18px; border-left: 3px solid; max-width: 640px; }
.msg.bad { background: color-mix(in oklch, var(--bad) 10%, transparent); border-color: var(--bad); color: var(--bad); }
.msg.good { background: color-mix(in oklch, var(--good) 10%, transparent); border-color: var(--good); color: var(--ink); }

button.btn { display: inline-block; margin: 6px 8px 0 0; padding: 8px 16px; font: 700 12.5px var(--mono); letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--on-gold); background: var(--gold); border: 1px solid var(--gold); border-radius: 0; cursor: pointer; }
button.btn::before { content: "[ "; } button.btn::after { content: " ]"; }
button.btn.quiet { background: transparent; color: var(--gold); border-color: var(--line-2); }
button.btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in oklch, var(--bad) 50%, transparent); }
button.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=url], input[type=search], input[type=number], textarea, select {
  padding: 8px 10px; background: var(--field); border: 1px solid var(--line-2); border-radius: 0; min-width: 0; }
textarea { width: 100%; resize: vertical; font: inherit; line-height: 1.5; }
label.field { display: grid; gap: 4px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
label.field input, label.field textarea { width: 100%; color: var(--ink); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; max-width: 900px; margin-bottom: 18px; }
.add input { flex: 1 1 260px; }
.add button.btn { margin: 0; }

.box { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
.shelf { position: sticky; top: 16px; }
.shelf input { width: 100%; margin-bottom: 8px; }
.recipes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.recipes button { display: block; width: 100%; text-align: left; padding: 9px 10px; background: none; border: 0; border-bottom: 1px dashed var(--line);
  border-left: 2px solid transparent; cursor: pointer; color: var(--muted); }
.recipes button small { display: block; color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recipes button:hover { background: var(--gold-soft); color: var(--ink); }
.recipes button[aria-current="true"] { background: var(--gold-soft); border-left-color: var(--gold); color: var(--ink); font-weight: 700; }
.empty { color: var(--faint); }

.recipe { max-width: 820px; }
.recipe .hero { width: 100%; max-height: 280px; object-fit: cover; display: block; margin-bottom: 16px; border: 1px solid var(--line); }
.recipe h2 { font-size: clamp(18px, 3vw, 24px); margin-bottom: 6px; }
.facts { color: var(--faint); font-size: 13px; margin-bottom: 14px; }
.facts a { color: var(--gold); }
.serves { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
.serves button { width: 32px; height: 32px; background: transparent; border: 1px solid var(--line-2); color: var(--gold); font-weight: 700; cursor: pointer; }
.serves output { min-width: 7ch; text-align: center; font-weight: 700; white-space: nowrap; }
.serves small { flex: 1 1 120px; }
.ingredients { list-style: none; margin: 0; padding: 0; }
.ingredients label { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; cursor: pointer; }
.ingredients input { accent-color: var(--gold); width: 15px; height: 15px; flex: none; transform: translateY(2px); }
.ingredients .changed { color: var(--gold); font-weight: 700; }
.send { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.send button.btn { margin: 0; }
ol.steps { margin: 0; padding-left: 22px; }
ol.steps li { margin-bottom: 10px; color: var(--ink); }
ol.steps li::marker { color: var(--gold); font-weight: 700; }
.notes { white-space: pre-wrap; }
.actions { margin-top: 18px; }

dialog { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--panel); color: var(--ink); border: 1px solid var(--gold); padding: 22px 24px; }
dialog::backdrop { background: rgb(0 0 0 / .55); }
dialog .two { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; padding-bottom: 0; }
  main { padding-top: 26px; }
  .keybar { display: none; }
  .box { grid-template-columns: 1fr; }
  .shelf { position: static; }
  .recipes { max-height: 40vh; overflow-y: auto; }
  dialog .two { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
<!--site-rail-->
<main>
  <div class="kicker">Recipe box</div>
  <h1>Recipes</h1>
  <p class="lede">Paste a link to a recipe to keep it here. Scale it to the servings you need and send what to buy to a Drift list.</p>
  <div id="error" class="msg bad" role="alert" hidden></div>
  <div id="done" class="msg good" role="status" hidden></div>

  <form class="add" id="add">
    <input type="url" id="url" placeholder="https://… a recipe page" aria-label="Recipe link" required>
    <button class="btn" id="save">Save</button>
    <button class="btn quiet" type="button" id="by-hand">Add by hand</button>
  </form>

  <div class="box">
    <aside class="shelf">
      <input type="search" id="find" placeholder="Find a recipe" aria-label="Find a recipe">
      <ul class="recipes" id="recipes"></ul>
    </aside>
    <section id="detail"><p class="empty">Loading…</p></section>
  </div>
</main>
</div>

<dialog id="editor">
  <form method="dialog" id="edit-form">
    <h2 id="edit-title">Edit recipe</h2>
    <label class="field">Title<input type="text" name="title" required maxlength="200"></label>
    <div class="two">
      <label class="field">Serves<input type="number" name="servings" min="1" max="1000" step="any"></label>
      <label class="field">Makes<input type="text" name="yield" maxlength="100" placeholder="12 cookies"></label>
      <label class="field">Time<input type="text" name="time" maxlength="50" placeholder="45 min"></label>
    </div>
    <label class="field">Ingredients, one per line<textarea name="ingredients" rows="8"></textarea></label>
    <label class="field">Steps, one per line<textarea name="steps" rows="8"></textarea></label>
    <label class="field">Notes<textarea name="notes" rows="3"></textarea></label>
    <label class="field">Link<input type="url" name="source" maxlength="2000"></label>
    <div class="row"><button class="btn" value="save">Save</button><button class="btn quiet" value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>

<footer class="keybar" aria-label="Keyboard shortcuts"><span><kbd>n</kbd>new from a link</span><span><kbd>/</kbd>find</span><span><kbd>j k</kbd>next, previous</span><span><kbd>+ -</kbd>servings</span><span><kbd>s</kbd>send to list</span><span><kbd>e</kbd>edit</span><span><kbd>g</kbd>then a key from the menu to jump</span><a class="end" href="/logout" data-key="o"><kbd>g o</kbd>Sign out</a></footer>
<script src="/keys.js" defer></script>
<script type="module" src="/recipes/app.js"></script>
</body>
</html>
