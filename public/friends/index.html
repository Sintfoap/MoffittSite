<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends &amp; Associates</title>
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f0a;
    --gold: oklch(0.78 0.11 85);
    --gold-dim: oklch(0.6 0.08 85);
    --ink: oklch(0.95 0.02 80);
    --muted: oklch(0.78 0.04 80);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'EB Garamond', serif; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 58%, #16261a 0%, #0b0f0a 65%); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .home { position: fixed; top: 26px; left: 30px; z-index: 20; color: oklch(0.82 0.05 85); opacity: 0.9; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; text-align: center; padding: 100px 16px 0; pointer-events: none; }
  .kicker { font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 4px; color: var(--gold); }
  h1 { font-weight: 500; font-size: clamp(32px, 5vw, 60px); margin: 12px 0 8px; }
  .sub { font-style: italic; color: var(--muted); font-size: 18px; margin: 0; }

  .system { position: fixed; left: 50%; top: 60%; width: 0; height: 0; z-index: 4; }
  .sun { position: absolute; z-index: 2; width: 96px; height: 96px; left: -48px; top: -48px; color: oklch(0.85 0.08 85);
    filter: drop-shadow(0 0 18px rgba(255, 200, 110, 0.45)); }
  .ring { position: absolute; border: 1px solid oklch(0.78 0.11 85 / 0.22); border-radius: 50%; pointer-events: none; }

  .body { position: absolute; left: 0; top: 0; text-decoration: none; color: inherit; outline: none;
    transform: translate(-50%, -50%); }
  .orb { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: #111;
    box-shadow: 0 0 0 1px rgba(80,230,210,0.45), 0 0 26px rgba(64,224,208,0.35);
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s; }
  .orb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .body.b .orb { background: #0c1a24; box-shadow: 0 0 0 1px rgba(140,210,255,0.45), 0 0 26px rgba(70,190,255,0.4); }
  .body:hover .orb, .body:focus-visible .orb, .body.active .orb { box-shadow: 0 0 0 1px rgba(80,230,210,0.7), 0 0 40px rgba(64,224,208,0.55); }
  .body.b:hover .orb, .body.b:focus-visible .orb, .body.b.active .orb { box-shadow: 0 0 0 1px rgba(140,210,255,0.7), 0 0 40px rgba(70,190,255,0.6); }
  .label { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 8px); white-space: nowrap; text-align: center;
    opacity: 0; transition: opacity 0.35s, transform 0.35s; pointer-events: none; }
  .label .name { font-size: 22px; font-weight: 500; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
  .label .url { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--gold); margin-top: 2px; }
  .body:hover .orb, .body:focus-visible .orb, .body.active .orb { transform: scale(1.25); }
  .body:hover .label, .body:focus-visible .label, .body.active .label { opacity: 1; transform: translate(-50%, 14px); }

  .hint { position: fixed; bottom: 26px; left: 0; right: 0; z-index: 5; text-align: center; font-family: 'Jost', sans-serif;
    font-size: 11px; letter-spacing: 2px; color: var(--gold-dim); }
  .hint a { color: inherit; }

  /* touch screens can't hover: keep names visible, shrink orbs */
  @media (hover: none) { .hover-only { display: none; } .label { opacity: 0.85; } .label .name { font-size: 18px; } }
  @media (max-width: 600px) { .orb { width: 56px; height: 56px; } .hint { padding: 0 16px; line-height: 1.8; } }
  .warp { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; background: #0b0f0a; transition: opacity 0.6s 0.5s; }
  body.leaving .warp { opacity: 1; }
  body.leaving .system { transition: transform 1.1s cubic-bezier(.6,0,.4,1); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<a class="home" href="/" aria-label="Home">
  <svg viewBox="0 0 120 120" width="62" height="62">
    <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
    <circle cx="60" cy="60" r="45" fill="none" stroke="currentColor" stroke-width="1"></circle>
    <path id="motto-path" d="M 20 66 A 40 40 0 1 1 100 66" fill="none"></path>
    <text font-family="Jost, sans-serif" font-size="8.5" letter-spacing="2.5" fill="currentColor"><textPath href="#motto-path" startOffset="50%" text-anchor="middle">SPERO MELIORA</textPath></text>
    <g transform="translate(60,66)" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="-11" y1="-11" x2="11" y2="11"></line><line x1="11" y1="-11" x2="-11" y2="11"></line>
      <line x1="0" y1="-24" x2="0" y2="-2"></line><line x1="-6" y1="-18" x2="6" y2="-18"></line>
    </g>
    <path d="M 34 78 Q 44 66 60 66 Q 76 66 86 78 L 82 88 Q 71 78 60 78 Q 49 78 38 88 Z" fill="currentColor"></path>
  </svg>
</a>

<header>
  <div class="kicker">FRIENDS &amp; ASSOCIATES</div>
  <h1>In Orbit</h1>
  <p class="sub">The people whose sites I keep circling back to.</p>
</header>

<div class="system" id="system">
  <div class="ring" id="ring-a"></div>
  <div class="ring" id="ring-b"></div>
  <svg class="sun" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="54" fill="#0b0f0a" stroke="currentColor" stroke-width="2.5"></circle>
    <circle cx="60" cy="60" r="45" fill="none" stroke="currentColor" stroke-width="1"></circle>
    <g transform="translate(60,66)" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="-11" y1="-11" x2="11" y2="11"></line><line x1="11" y1="-11" x2="-11" y2="11"></line>
      <line x1="0" y1="-24" x2="0" y2="-2"></line><line x1="-6" y1="-18" x2="6" y2="-18"></line>
    </g>
    <path d="M 34 78 Q 44 66 60 66 Q 76 66 86 78 L 82 88 Q 71 78 60 78 Q 49 78 38 88 Z" fill="currentColor"></path>
  </svg>
  <a class="body a" id="body-a" href="https://joshammer.com" data-go>
    <div class="orb"><img src="josh-hammer.png" alt="" width="180" height="180"></div>
    <div class="label"><div class="name">Josh Hammer</div><div class="url">JOSHAMMER.COM ↗</div></div>
  </a>
  <a class="body b" id="body-b" href="https://rhysfuller.com" data-go>
    <div class="orb"><img src="rhys-fuller.png" alt="" width="298" height="298"></div>
    <div class="label"><div class="name">Rhys Fuller</div><div class="url">RHYSFULLER.COM ↗</div></div>
  </a>
</div>

<div class="hint"><span class="hover-only">HOVER TO HOLD AN ORBIT · </span><a href="/">BACK HOME</a></div>
<div class="warp"></div>

<script>
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sys = document.getElementById('system');

  // Orbits: elliptical (tilted-disc look), different radii and speeds.
  var bodies = [
    { el: document.getElementById('body-a'), ring: document.getElementById('ring-a'), r: 0.36, speed: 0.16, angle: 0.4 },
    { el: document.getElementById('body-b'), ring: document.getElementById('ring-b'), r: 0.52, speed: -0.10, angle: 3.6 }
  ];
  var TILT = innerWidth < 600 ? 0.7 : 0.42; // vertical squash of each orbit
  var held = null;

  function size() {
    var base = Math.min(innerWidth - 60, innerHeight * 1.6) * 0.5;
    // keep the outer orbit's labels on-screen on narrow viewports
    base = Math.min(base, (innerWidth / 2 - 75) / (0.52 * 1.6));
    bodies.forEach(function (b) {
      b.rx = base * b.r * 1.6; b.ry = b.rx * TILT;
      b.ring.style.width = (b.rx * 2) + 'px'; b.ring.style.height = (b.ry * 2) + 'px';
      b.ring.style.left = -b.rx + 'px'; b.ring.style.top = -b.ry + 'px';
    });
  }

  bodies.forEach(function (b) {
    b.el.addEventListener('mouseenter', function () { held = b; });
    b.el.addEventListener('mouseleave', function () { if (held === b) held = null; });
    b.el.addEventListener('focus', function () { held = b; });
    b.el.addEventListener('blur', function () { if (held === b) held = null; });
    b.el.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (reduce) return;
      e.preventDefault();
      held = b; b.el.classList.add('active');
      // Zoom the whole system toward the chosen body, then fade out.
      var x = Math.cos(b.angle) * b.rx, y = Math.sin(b.angle) * b.ry;
      document.body.classList.add('leaving');
      sys.style.transform = 'scale(6) translate(' + (-x) + 'px,' + (-y) + 'px)';
      setTimeout(function () { location.href = b.el.href; }, 1150);
    });
  });
  addEventListener('pageshow', function () {
    document.body.classList.remove('leaving'); sys.style.transform = ''; held = null;
    bodies.forEach(function (b) { b.el.classList.remove('active'); });
  });

  // Starfield
  var c = document.getElementById('sky'), g = c.getContext('2d'), stars = [], dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    stars = [];
    var n = Math.round(innerWidth * innerHeight / 5000);
    for (var i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + 0.2, p: Math.random() * 6.28 });
    size();
  }
  addEventListener('resize', resize); resize();

  var last = performance.now();
  function frame(t) {
    var dt = Math.min((t - last) / 1000, 0.05); last = t;
    g.clearRect(0, 0, c.width, c.height);
    stars.forEach(function (s) {
      var a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t / 1400 + s.p));
      g.fillStyle = 'rgba(255, 236, 200,' + a + ')';
      g.beginPath(); g.arc(s.x * c.width, s.y * c.height, s.r * dpr, 0, 6.283); g.fill();
    });
    bodies.forEach(function (b) {
      if (held !== b && !reduce) b.angle += b.speed * dt;
      var x = Math.cos(b.angle) * b.rx, y = Math.sin(b.angle) * b.ry;
      b.el.style.left = x + 'px'; b.el.style.top = y + 'px';
      // in front of the crest on the near half of the orbit, behind on the far half
      b.el.style.zIndex = y > 0 ? 3 : 1;
      b.el.style.opacity = y > 0 ? 1 : 0.8;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
