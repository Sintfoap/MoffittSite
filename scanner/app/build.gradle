// Pantry scanner: the phone app for filling Pantry (src/pantry.js) while you
// unpack groceries. It snaps receipts (read by the site) and scans barcodes
// on the phone (ML Kit), and sends what you check to the site. It pairs once by scanning a QR code on the Pantry page; see the
// README's "Pantry scanner" section.
//
//   gradle -p scanner assembleDebug                         a test build
//   gradle -p scanner testDebugUnitTest                     its tests
//   gradle -p scanner assembleRelease -PappVersion=3        version 3, signed with the key in
//                                                           ANDROID_KEYSTORE / _PASSWORD / ANDROID_KEY_ALIAS
//                                                           (what .github/workflows/scanner.yml does for a tag scanner-v3)
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "io.github.takahirom.roborazzi"
}

def version = (project.findProperty("appVersion") ?: "1").toString().toInteger()

android {
    namespace "xyz.sintfoap.scanner"
    compileSdk 35

    defaultConfig {
        applicationId "xyz.sintfoap.scanner"
        minSdk 26
        targetSdk 35
        versionCode version
        versionName version.toString()
        // Phones only (ML Kit's models come in per processor; this keeps the APK small).
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        buildConfigField "String", "DEFAULT_SITE", "\"${(project.findProperty("site") ?: "https://sintfoap.xyz").toString()}\""
    }

    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    testOptions { unitTests { returnDefaultValues = true; includeAndroidResources = true } }
}

dependencies {
    def camerax = "1.4.1"
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    // Pictures of the screens, drawn on the computer (gradle -p scanner recordRoborazziDebug), to look at.
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.39.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.39.0"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
