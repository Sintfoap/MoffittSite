<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends &amp; Associates — The Two Doors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f0a;
    --gold: oklch(0.78 0.11 85);
    --gold-dim: oklch(0.6 0.08 85);
    --ink: oklch(0.95 0.02 80);
    --muted: oklch(0.78 0.04 80);
    --stone: #1b211a;
    --stone-hi: #2a3228;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'EB Garamond', serif; }
  body {
    min-height: 100vh; overflow-x: hidden;
    background: radial-gradient(circle at 50% 60%, #141d14 0%, #0b0f0a 70%);
  }
  /* glow that drifts toward whichever door is hovered */
  .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at var(--gx, 50%) 62%, rgba(255, 180, 80, var(--ga, 0.04)) 0%, transparent 40%);
  }
  .home { position: fixed; top: 26px; left: 30px; z-index: 20; color: oklch(0.82 0.05 85); opacity: 0.9; }
  header { position: relative; z-index: 1; text-align: center; padding: 110px 16px 0; }
  .kicker { font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 4px; color: var(--gold); }
  h1 { font-weight: 500; font-size: clamp(36px, 6vw, 72px); margin: 14px 0 10px; }
  .sub { font-style: italic; color: var(--muted); font-size: 19px; margin: 0; }

  .threshold { position: relative; z-index: 1; display: flex; justify-content: center; gap: clamp(24px, 8vw, 110px); padding: 60px 16px 40px; }
  .door { display: block; text-decoration: none; color: inherit; width: min(220px, 40vw); outline: none; }
  .lintel { text-align: center; font-family: 'Jost', sans-serif; font-size: clamp(10px, 1.6vw, 12px); letter-spacing: 4px; color: var(--gold-dim);
    margin-bottom: 14px; transition: color 0.5s, text-shadow 0.5s; }
  .arch {
    position: relative; aspect-ratio: 5 / 8; border-radius: 50% 50% 4px 4px / 31% 31% 4px 4px;
    padding: 10px; background: linear-gradient(to bottom, var(--stone-hi), var(--stone));
    box-shadow: inset 0 0 0 1px rgba(255,220,150,0.12), 0 30px 50px rgba(0,0,0,0.6);
  }
  .opening {
    position: relative; width: 100%; height: 100%; overflow: hidden; perspective: 900px;
    border-radius: 50% 50% 2px 2px / 33% 33% 2px 2px;
    background: radial-gradient(ellipse at 50% 70%, oklch(0.95 0.08 85) 0%, oklch(0.78 0.14 70) 35%, oklch(0.45 0.1 50) 70%, #1a0f05 100%);
  }
  .leaf {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background:
      repeating-linear-gradient(to right, transparent 0 22px, rgba(0,0,0,0.22) 22px 24px),
      linear-gradient(to bottom, #3b2a1a, #24180e);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
    transition: transform 0.9s cubic-bezier(.3,.7,.2,1);
  }
  .leaf.l { left: 0; transform-origin: 0 50%; }
  .leaf.r { right: 0; transform-origin: 100% 50%; }
  .leaf::after { /* iron ring handle */
    content: ""; position: absolute; top: 56%; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid oklch(0.6 0.06 85);
  }
  .leaf.l::after { right: 8px; } .leaf.r::after { left: 8px; }
  .initials { position: absolute; top: 24%; left: 0; right: 0; text-align: center; z-index: 2; pointer-events: none;
    font-size: clamp(26px, 5vw, 40px); font-weight: 500; color: oklch(0.72 0.08 85); letter-spacing: 3px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6); transition: opacity 0.6s; }
  .spill { /* light on the floor in front of the door */
    height: 40px; margin: -6px auto 0; width: 70%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,190,90,0.55), transparent 70%); opacity: 0; filter: blur(4px);
    transition: opacity 0.7s, width 0.7s; }
  .name { text-align: center; margin-top: 10px; font-size: clamp(20px, 3.2vw, 28px); font-weight: 500; }

  .door:hover .leaf.l, .door:focus-visible .leaf.l { transform: rotateY(-24deg); }
  .door:hover .leaf.r, .door:focus-visible .leaf.r { transform: rotateY(24deg); }
  .door:hover .spill, .door:focus-visible .spill { opacity: 1; width: 110%; }
  .door:hover .lintel, .door:focus-visible .lintel { color: var(--gold); text-shadow: 0 0 14px rgba(255,200,110,0.5); }

  /* click-through: doors swing wide, light floods the screen */
  .door.open .leaf.l { transform: rotateY(-100deg); }
  .door.open .leaf.r { transform: rotateY(100deg); }
  .door.open .initials { opacity: 0; }
  .flood { position: fixed; z-index: 50; pointer-events: none; border-radius: 50%;
    width: 10px; height: 10px; left: var(--x); top: var(--y); transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, oklch(0.97 0.05 85) 0%, oklch(0.85 0.12 75) 45%, oklch(0.6 0.12 60) 100%);
    transition: transform 1s cubic-bezier(.6,0,.4,1) 0.35s; }
  body.leaving .flood { transform: translate(-50%, -50%) scale(400); }

  footer { position: relative; z-index: 1; text-align: center; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--gold-dim); padding: 20px 0 40px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="ambient"></div>
<a class="home" href="/" aria-label="Home">
  <svg viewBox="0 0 120 120" width="62" height="62">
    <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
    <circle cx="60" cy="60" r="45" fill="none" stroke="currentColor" stroke-width="1"></circle>
    <path id="motto-path" d="M 20 66 A 40 40 0 1 1 100 66" fill="none"></path>
    <text font-family="Jost, sans-serif" font-size="8.5" letter-spacing="2.5" fill="currentColor"><textPath href="#motto-path" startOffset="50%" text-anchor="middle">SPERO MELIORA</textPath></text>
    <g transform="translate(60,66)" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="-11" y1="-11" x2="11" y2="11"></line><line x1="11" y1="-11" x2="-11" y2="11"></line>
      <line x1="0" y1="-24" x2="0" y2="-2"></line><line x1="-6" y1="-18" x2="6" y2="-18"></line>
    </g>
    <path d="M 34 78 Q 44 66 60 66 Q 76 66 86 78 L 82 88 Q 71 78 60 78 Q 49 78 38 88 Z" fill="currentColor"></path>
  </svg>
</a>

<header>
  <div class="kicker">FRIENDS &amp; ASSOCIATES</div>
  <h1>Two Doors</h1>
  <p class="sub">Each opens onto someone else's corner of the web.</p>
</header>

<main class="threshold">
  <a class="door" href="https://joshammer.com" data-go>
    <div class="lintel">JOSHAMMER.COM</div>
    <div class="arch"><div class="opening">
      <div class="leaf l"></div><div class="leaf r"></div>
      <div class="initials">JH</div>
    </div></div>
    <div class="spill"></div>
    <div class="name">Josh Hammer</div>
  </a>
  <a class="door" href="https://rhysfuller.com" data-go>
    <div class="lintel">RHYSFULLER.COM</div>
    <div class="arch"><div class="opening">
      <div class="leaf l"></div><div class="leaf r"></div>
      <div class="initials">RF</div>
    </div></div>
    <div class="spill"></div>
    <div class="name">Rhys Fuller</div>
  </a>
</main>

<footer>CONCEPT B · <a href="./">ALL CONCEPTS</a></footer>
<div class="flood"></div>

<script>
  var ambient = document.querySelector('.ambient');
  document.querySelectorAll('[data-go]').forEach(function (a) {
    a.addEventListener('mouseenter', function () {
      var r = a.getBoundingClientRect();
      ambient.style.setProperty('--gx', (r.left + r.width / 2) + 'px');
      ambient.style.setProperty('--ga', '0.16');
    });
    a.addEventListener('mouseleave', function () { ambient.style.setProperty('--ga', '0.04'); });
    a.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();
      var r = a.querySelector('.opening').getBoundingClientRect();
      document.body.style.setProperty('--x', (r.left + r.width / 2) + 'px');
      document.body.style.setProperty('--y', (r.top + r.height * 0.6) + 'px');
      a.classList.add('open');
      document.body.classList.add('leaving');
      setTimeout(function () { location.href = a.href; }, 1350);
    });
  });
  addEventListener('pageshow', function () {
    document.body.classList.remove('leaving');
    document.querySelectorAll('.door.open').forEach(function (el) { el.classList.remove('open'); });
  });
</script>
</body>
</html>
